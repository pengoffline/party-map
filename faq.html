<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Map • 答疑解惑</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="eyebrow">SECTION LABEL · 副標籤文字</div>
    <h1>答疑解惑</h1>
    <p>這裡放一段簡短說明,介紹這個頁面的用途,樣式跟首頁的說明文字一致。</p>
  </header>

  <!-- ============ 章節一 ============ -->
  <section>
    <h2 class="section-heading">第一個章節標題</h2>
    <div class="content-card">
      <p>這裡放章節內容。這個 .content-card 區塊背景跟首頁的題目卡片、說明卡片同一套樣式,可以直接放文字、清單、表格等內容。</p>
      <ul>
        <li>條列項目一</li>
        <li>條列項目二</li>
      </ul>
    </div>
  </section>

  <!-- ============ 章節二 ============ -->
  <section>
    <h2 class="section-heading">第二個章節標題</h2>
    <div class="content-card">
      <p>這裡放另一段內容。可以直接複製這個 &lt;section&gt; 區塊來新增更多章節,只要換掉 h2 文字跟裡面的內容即可。</p>
    </div>
  </section>

  <!-- ============ 白底文字區塊範例 ============ -->
  <div class="notes-block">
    <p class="placeholder">（這是一個白底文字區塊,適合放需要跟其他區塊視覺區隔的補充說明,直接複製使用即可）</p>
  </div>

  <div class="footer-note">
    這裡放頁尾說明文字,樣式跟首頁的頁尾一致。
  </div>
</div>

</body>
</html>
